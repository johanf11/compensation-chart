<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay Compression by Sales Role</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 28px 32px 24px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9edf2;
        }

        .card-header {
            margin-bottom: 8px;
        }

        .card-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }

        .card-header .subtitle {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            margin-top: 2px;
        }

        .chart-wrapper {
            height: 460px;
            margin-top: 8px;
            position: relative;
        }

        .legend-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 12px;
            color: #64748b;
            flex-wrap: wrap;
            gap: 8px;
        }

        .legend-note .legend-items {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .legend-note .legend-items span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .legend-note .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .legend-note .tenure-arrow {
            font-weight: 600;
            color: #1a1a2e;
        }

        .footer {
            margin-top: 14px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 14px;
        }

        .sample-size-badge {
            display: inline-block;
            background: #e9edf2;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #475569;
        }

        @media (max-width: 640px) {
            .card {
                padding: 16px;
            }
            .card-header h1 {
                font-size: 18px;
            }
            .chart-wrapper {
                height: 380px;
            }
            .legend-note {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                <div>
                    <h1>Pay Compression by Sales Role</h1>
                    <div class="subtitle">Median Compa-Ratio Gap to Market</div>
                </div>
                <span class="sample-size-badge">n=500</span>
            </div>
        </div>

        <div class="chart-wrapper">
            <canvas id="compressionChart"></canvas>
        </div>

        <div class="legend-note">
            <div class="legend-items">
                <span><span class="dot" style="background:#6161ff;"></span> 0–1 yr (n=102)</span>
                <span><span class="dot" style="background:#00c875;"></span> 1–2 yrs (n=93)</span>
                <span><span class="dot" style="background:#ffab00;"></span> 2–4 yrs (n=137)</span>
                <span><span class="dot" style="background:#ff5a5a;"></span> 4+ yrs (n=168)</span>
            </div>
            <span class="tenure-arrow">Increasing tenure →</span>
        </div>

        <div class="footer">
            Data: Sales Compensation Case Study &bull; 500 US-based employees (NYC + Denver) &bull; 5 sales roles
        </div>
    </div>

    <script>
        // Register the datalabels plugin
        Chart.register(ChartDataLabels);

        // ----- DATA: Gap to Market % (1 - CompaRatio) * 100 -----
        const roleLabels = ['SDR', 'Mid-Market AE', 'Senior AE', 'Enterprise AE', 'Sales Manager'];

        // Tenure groups: [0-1yr, 1-2yr, 2-4yr, 4+yr]
        // Values are negative gaps (below market)
        const gapData = {
            '0–1 yr': [-5, -6, -6, -4, -5],
            '1–2 yrs': [-11, -10, -10, -10, -10],
            '2–4 yrs': [-13, -12, -12, -14, -13],
            '4+ yrs': [-26, -29, -29, -25, -27]
        };

        // Headcounts (n) by role and tenure
        const countData = {
            '0–1 yr': [30, 38, 21, 7, 6],
            '1–2 yrs': [33, 24, 18, 14, 4],
            '2–4 yrs': [43, 37, 28, 18, 11],
            '4+ yrs': [44, 51, 33, 31, 9]
        };

        // Colors (monday.com brand colors)
        const colors = {
            '0–1 yr': '#6161ff',   // monday.com violet
            '1–2 yrs': '#00c875',  // monday.com green
            '2–4 yrs': '#ffab00',  // monday.com yellow
            '4+ yrs': '#ff5a5a'    // red (highlighting the problem)
        };

        const borderColors = {
            '0–1 yr': '#4a4ad6',
            '1–2 yrs': '#00b86b',
            '2–4 yrs': '#e69900',
            '4+ yrs': '#e64a4a'
        };

        // Build datasets
        const tenureKeys = ['0–1 yr', '1–2 yrs', '2–4 yrs', '4+ yrs'];
        const datasets = tenureKeys.map((key) => {
            return {
                label: key,
                data: gapData[key],
                backgroundColor: colors[key],
                borderColor: borderColors[key],
                borderWidth: 1,
                borderRadius: 3,
                barThickness: 32,
                counts: countData[key],
            };
        });

        const ctx = document.getElementById('compressionChart').getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: roleLabels,
                datasets: datasets,
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false,
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const gap = context.parsed.y;
                                const count = context.dataset.counts[context.dataIndex];
                                return context.dataset.label + ': ' + gap.toFixed(0) + '% below market (' + count +
                                    ' employees)';
                            }
                        }
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'end',
                        color: '#ffffff',
                        font: {
                            weight: 'bold',
                            size: 12,
                        },
                        formatter: function(value) {
                            return value.toFixed(0) + '%';
                        },
                        offset: 0,
                        display: function(context) {
                            return context.dataset.data[context.dataIndex] !== 0;
                        }
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false,
                        },
                        ticks: {
                            font: {
                                size: 11,
                                weight: '600',
                            },
                            color: '#1a1a2e',
                            maxRotation: 0,
                        },
                    },
                    y: {
                        min: -35,
                        max: 2,
                        ticks: {
                            callback: function(value) {
                                return value.toFixed(0) + '%';
                            },
                            font: {
                                size: 11,
                                weight: '500',
                            },
                            color: '#64748b',
                            stepSize: 5,
                        },
                        grid: {
                            color: '#e9edf2',
                            drawBorder: false,
                        },
                    }
                },
            },
            plugins: [{
                id: 'zeroLine',
                afterDraw: function(chart) {
                    const yScale = chart.scales.y;
                    const xScale = chart.scales.x;
                    const ctx2 = chart.ctx;

                    // Draw zero line with updated label
                    if (yScale.min <= 0 && yScale.max >= 0) {
                        const yZero = yScale.getPixelForValue(0);

                        ctx2.save();
                        ctx2.beginPath();
                        ctx2.moveTo(xScale.left, yZero);
                        ctx2.lineTo(xScale.right, yZero);
                        ctx2.strokeStyle = '#1a1a2e';
                        ctx2.lineWidth = 2;
                        ctx2.setLineDash([6, 4]);
                        ctx2.stroke();

                        // Updated label with more right-side padding
                        ctx2.fillStyle = '#1a1a2e';
                        ctx2.font = 'bold 10px Inter, sans-serif';
                        ctx2.textAlign = 'right';
                        ctx2.textBaseline = 'bottom';
                        // Position it 20px from the right edge of the chart
                        ctx2.fillText('Target Market Ratio', xScale.right - 20, yZero - 4);

                        ctx2.restore();
                    }

                    // Draw count labels at the top of each bar
                    ctx2.save();

                    chart.data.datasets.forEach((dataset, datasetIndex) => {
                        const metaData = chart.getDatasetMeta(datasetIndex);
                        const counts = dataset.counts || [];

                        metaData.data.forEach((bar, index) => {
                            const count = counts[index];
                            if (!count) return;

                            const value = dataset.data[index];
                            const x = bar.x;
                            const y = bar.y;

                            if (value <= 0 && Math.abs(value) > 0) {
                                const yPos = y - 6;

                                ctx2.fillStyle = '#475569';
                                ctx2.font = '9px Inter, sans-serif';
                                ctx2.textAlign = 'center';
                                ctx2.textBaseline = 'bottom';
                                ctx2.fillText(count, x, yPos);
                            }
                        });
                    });

                    ctx2.restore();
                }
            }]
        });
    </script>

</body>
</html>
